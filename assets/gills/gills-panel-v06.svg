    <g id="mounting-holes">
      <circle class="cutout" cx="5.5" cy="13.5" r="1.7"/>
      <circle class="cutout" cx="152.5" cy="13.5" r="1.7"/>
      <circle class="cutout" cx="5.5" cy="94.5" r="1.7"/>
      <circle class="cutout" cx="152.5" cy="94.5" r="1.7"/>
    </g>
    <g id="vent-slots">
      <rect class="cutout" x="13" y="1.8" width="16" height="1.4" rx="0.4"/>
      <rect class="cutout" x="71" y="1.8" width="16" height="1.4" rx="0.4"/>
      <rect class="cutout" x="129" y="1.8" width="16" height="1.4" rx="0.4"/>
      <rect class="cutout" x="13" y="96.8" width="16" height="1.4" rx="0.4"/>
      <rect class="cutout" x="71" y="96.8" width="16" height="1.4" rx="0.4"/>
      <rect class="cutout" x="129" y="96.8" width="16" height="1.4" rx="0.4"/>
      <rect class="cutout" x="1.8" y="24" width="1.4" height="16" rx="0.4"/>
      <rect class="cutout" x="1.8" y="67" width="1.4" height="16" rx="0.4"/>
      <rect class="cutout" x="154.8" y="24" width="1.4" height="16" rx="0.4"/>
      <rect class="cutout" x="154.8" y="67" width="1.4" height="16" rx="0.4"/>
    </g>
    <g id="top-io-legends" class="legend small">
      <text x="9" y="6.6">9-18VDC</text>
      <text x="31" y="6.6">L IN</text>
      <text x="47" y="6.6">R IN</text>
      <text x="78" y="6.6">SD</text>
      <text x="97" y="6.6">PWR-PROG</text>
      <text x="116" y="6.6">HOST</text>
      <text x="137" y="6.6">L OUT</text>
      <text x="151" y="6.6">R OUT</text>
