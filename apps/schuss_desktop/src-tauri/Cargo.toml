[package]
name = "schuss-desktop"
version = "0.1.0"
description = "Read-only Schuss catalog desktop shell"
authors = ["Schuss contributors"]
edition = "2021"

[lib]
name = "schuss_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
