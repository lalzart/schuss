<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="158mm" height="100mm" viewBox="0 0 158 100" role="img" aria-labelledby="panel-title panel-description">
  <title id="panel-title">Ksoloti Gills v0.6 panel layout</title>
  <desc id="panel-description">Editable technical silhouette derived from the pinned Ksoloti Gills v0.6 CAD, with stable regions for Schuss semantic highlighting.</desc>
  <metadata id="asset-attribution">Adapted for Schuss from Ksoloti Gills hardware revision v0.6 at commit 280503036aee95e6c6ef91a1f1357443f4768faa. Original hardware design copyright Ksoloti contributors, licensed CC BY 4.0. This normalized technical view is a modification and is not manufacturing artwork.</metadata>
  <style>
    .panel { fill: #e8e9e5; stroke: #252728; stroke-width: 0.5; }
    .cutout { fill: #252728; stroke: #111; stroke-width: 0.25; }
    .control { fill: #191b1c; stroke: #050505; stroke-width: 0.4; cursor: pointer; }
    .control-core { fill: #b9bab5; stroke: #454746; stroke-width: 0.3; pointer-events: none; }
    .button { fill: #d8d1b5; stroke: #403b31; stroke-width: 0.5; cursor: pointer; }
    .indicator { fill: #3c3d39; stroke: #151515; stroke-width: 0.25; cursor: pointer; }
    .legend { fill: #202223; font-family: ui-monospace, monospace; font-size: 2.3px; text-anchor: middle; pointer-events: none; }
    .small { font-size: 1.8px; }
    .brand { font-size: 4px; letter-spacing: 0.45px; }
    .highlight { fill: none; stroke: transparent; stroke-width: 1.4; pointer-events: none; }
    .highlight.is-highlighted { stroke: #ff7a18; filter: drop-shadow(0 0 1px #ff7a18); }
  </style>
  <g id="panel-geometry">
